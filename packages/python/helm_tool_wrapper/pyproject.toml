[project]
name = "helm-tool-wrapper"
version = "0.2.0"
description = "Thin HELM AI Kernel preflight wrapper for Python agent tool calls"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Mindburn Labs", email = "oss@mindburn.org" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.4.0",
  "mypy==1.18.1",
  "pytest==8.4.2",
  "ruff==0.13.0",
  "tomli==2.4.1; python_version < '3.11'",
  "twine==6.2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helm_tool_wrapper*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
