[project]
name = "helm-worker-openclaw"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["helm-worker-runtime==0.1.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helm_openclaw_worker*"]

[tool.ruff]
line-length = 100
target-version = "py310"
