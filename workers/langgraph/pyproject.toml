[project]
name = "helm-worker-langgraph"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["helm-worker-runtime==0.1.0", "langgraph==1.2.12", "langchain-openai==1.6.6", "langchain-anthropic==1.7.5", "langchain-mcp-adapters==0.3.2", "mcp==1.30.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helm_langgraph_worker*"]
