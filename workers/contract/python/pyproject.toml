[project]
name = "helm-worker-contract"
version = "0.1.0"
description = "helm.episode.v1 contract for HELM agent workers: schemas, types, outcome rules, AgentCard template"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mindburn Labs", email = "oss@mindburn.org" }]
dependencies = ["jsonschema==4.26.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helm_worker_contract*"]

[tool.setuptools.package-data]
helm_worker_contract = ["schema/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

# jsonschema ships no type information.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
