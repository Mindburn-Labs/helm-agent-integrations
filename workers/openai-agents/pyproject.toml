[project]
name = "helm-worker-openai-agents"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["helm-worker-runtime==0.1.0", "openai-agents==0.22.3", "mcp==1.30.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helm_openai_worker*"]
