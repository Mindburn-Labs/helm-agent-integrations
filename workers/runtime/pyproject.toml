[project]
name = "helm-worker-runtime"
version = "0.1.0"
description = "Shared A2A v1 transport and bounded episode lifecycle for HELM workers"
requires-python = ">=3.10"
dependencies = ["helm-worker-contract==0.1.0"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["helm_worker_runtime*"]

[tool.ruff]
line-length = 100
target-version = "py310"
