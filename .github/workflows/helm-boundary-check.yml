name: HELM Boundary Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "packages/js/helm-tool-wrapper/package-lock.json"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install TypeScript package dependencies
        run: npm install
        working-directory: packages/js/helm-tool-wrapper

      - name: Test TypeScript wrapper
        run: npm test
        working-directory: packages/js/helm-tool-wrapper

      - name: Test Python wrapper
        run: python -m unittest discover packages/python/helm_tool_wrapper/tests

      - name: Verify generated samples
        uses: ./.github/actions/helm-boundary-check
        with:
          repo: .
