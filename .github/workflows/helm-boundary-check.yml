# Python 3.9 compatibility. `make check` (ci.yml, required check `ci / gate`)
# runs every gate on Python 3.12. The Python package declares
# requires-python >= 3.9, so this non-required workflow reruns the Python
# gates on 3.9.
name: HELM Boundary Check (Python 3.9)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-39:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Lint, test and run the Python examples and sample checks
        run: make lint test-python examples-python samples verify-samples

      - name: Verify generated samples through the composite action
        uses: ./.github/actions/helm-boundary-check
        with:
          repo: .
