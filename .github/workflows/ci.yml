# CI v2 caller. The required status check is `ci / gate`, so keep the job id `ci`.
#
# This repository is public and platform-actions is internal. GitHub does not let
# a public repository call a reusable workflow from an internal one, so `ci-v2.yml`
# is a byte-identical copy of Mindburn-Labs/platform-actions
# .github/workflows/ci.yml at tag v2 (6d84391e40ef265dfcaf8485090c6a9dbf15eed4).
# Refresh it from there; do not edit it here.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci-v2.yml
