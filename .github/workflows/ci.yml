# CI v2 caller. The required status check is `ci / gate`, so keep the job id `ci`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2.0.1
    with:
      # `make check` is hermetic. The workers' conformance kit runs real containers on an
      # isolated Docker network, so it runs right after `make check` inside the same
      # required `ci / gate`.
      extra-commands: make workers-conformance
