# Patch and minor updates arrive as one grouped PR per ecosystem; majors come
# one PR each. Runtime dependency updates are committed as `fix(deps)`, so
# auto-tag.yml@v2 cuts a patch release for them; dev dependencies and actions
# use `chore`/`ci` and release nothing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: pip
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]
